    # sub_82252068 dispatches here through ctr after restoring the containing
    # function's live PPC state. Keep the original indirect dispatcher and
    # expose each unique case continuation through its shared epilogue to
    # XeO3. Repeated table entries all resolve to the 0x82252AB0 epilogue.
