# Address-taken continuation blocks and leaf accessors between adjacent pdata
# functions, plus functions
# whose pdata ranges split conditional-return fallthrough tails. Passive XeO3
# traces proved 0x8228AFE0 and 0x822AF840 are externally re-entered
# virtual-dispatch functions. Mission 01 runtime dispatch proved the three
# 0x8228BC30 predicate helpers and six 0x823222F0 virtual-method tail thunks
# are separate entries. The remaining constructed-address, non-local-branch
# candidates were boundary-checked against the current mapping and PPC
# disassembly; split ranges below stop before the next known function. A
# corrected hidden-entry scan also found the data/vtable-referenced functions
# following bctr terminals; all listed bctr entries were disassembled through
# their terminal boundary.
